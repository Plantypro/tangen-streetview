<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tangen 7 - Google Street View</title>
    <style>
      html, body { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background-color: #000;
        overflow: hidden;
      }
      #streetview-container, gmp-street-view-panorama {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
    </style>
    
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>

    <script>
      (g=>{var h=[],c=g.navigator,e=g.JSON,f=g.performance,d=g.document,l=g.location,b=g.google||(g.google={}),k=b.maps||(b.maps={}),m=k.then||(k.then=function(a){h.push(a)}),n=new URLSearchParams,p=function(a,e){return function(){var b=Array.prototype.slice.call(arguments);return(e?e():Promise.resolve()).then(function(c){return c[a].apply(c,b)})}};b.maps.importLibrary=p("importLibrary",function(){return m});d.addEventListener("DOMContentLoaded",function(){var a=d.createElement("script");a.src=l.protocol+"//maps.googleapis.com/maps/api/js?key=AIzaSyAKCY3L1KdO4oqxu_JVICbkMCVHAcQOWNw&libraries=core,maps,streetView&v=beta&callback=initPlatform";k.then=function(b){a.remove();b.initPlatform()};d.head.append(a)});m(function(a){k.libraries=a.libraries})})(window);
    </script>
  </head>
  <body>

    <div id="streetview-container">
      <gmp-street-view-panorama 
        id="panorama"
        position="59.000383, 5.659569" 
        sources="DEFAULT"
        heading="180" 
        pitch="0" 
        zoom="1">
      </gmp-street-view-panorama>
    </div>

    <script>
      let scene, camera, renderer, modell, panoramaElement;

      async function initPlatform() {
        panoramaElement = document.getElementById("panorama");

        // Sett opp Three.js overflatelaget
        setupThreeJS();

        // Konfigurer GLTF-loaderen med DRACO-dekoding for Revit-filen din
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        
        // Last inn Revit-modellen din
        loader.load('25012 Tangen 7 - Nybygg.glb', function (gltf) {
          modell = gltf.scene;
          
          // Hever modellen litt (0.5 meter) i tilfelle den havnet under asfalten i scenen
          modell.position.set(0, 0.5, 0); 
          modell.rotation.y = Math.PI * (45 / 180); 
          
          scene.add(modell);
          animate();
        }, undefined, function (error) {
          console.error('Kunne ikke laste 3D-modellen:', error);
        });

        // Synkroniserer endringer i kameraet
        panoramaElement.addEventListener('gmp-povchanged', () => {
          updateCameraOrientation();
        });
        
        panoramaElement.addEventListener('gmp-zoomchanged', () => {
          updateCameraOrientation();
        });
      }

      function setupThreeJS() {
        const container = document.getElementById("streetview-container");
        scene = new THREE.Scene();
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
        directionalLight.position.set(10, 25, 15);
        scene.add(directionalLight);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.pointerEvents = 'none'; 
        container.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
        
        // Kjører en oppdatering etter at kartet har rukket å starte opp skikkelig
        setTimeout(updateCameraOrientation, 800);
      }

      function updateCameraOrientation() {
        if (!panoramaElement || !camera) return;
        
        const heading = panoramaElement.heading || 180;
        const pitch = panoramaElement.pitch || 0;
        const zoom = panoramaElement.zoom || 1;

        const headingRad = THREE.MathUtils.degToRad(heading);
        const pitchRad = THREE.MathUtils.degToRad(pitch);

        camera.rotation.set(pitchRad, -headingRad, 0, 'YXZ');
        camera.fov = 180 / Math.pow(2, zoom);
        camera.updateProjectionMatrix();
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
