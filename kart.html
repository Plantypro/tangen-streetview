<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tangen 7 - Georeferert Street View</title>
    <style>
      html, body, #streetview-container { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background-color: #000;
        overflow: hidden;
      }
    </style>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  </head>
  <body>
    <div id="streetview-container"></div>

    <script>
      // ==========================================================
      // ABSOLUTTE GEOGRAFISKE KOORDINATER FRA CIVIL 3D (UTM-32N)
      // ==========================================================
      // De eksakte koordinatene til Geographic Marker (det blå/røde krysset)
      const CIVIL3D_ORIGO = { east: 307995.6157, north: 6544604.4177 };
      const CIVIL3D_ROTASJON_NORD = 31.75; 
      
      // HØYDEPLAN: Siden kote 0.00 er havnivå, og veien ligger på ca. +2.3m,
      // og Google-kameraet er 1.6m over asfalten, setter vi kote 0.00 til -3.9 meter.
      const KOTE_NULL_HØYDE = -3.9; 

      // Startposisjon for Google Street View ute i veien (Tangen 7)
      const kameraStartGPS = { lat: 59.000383, lng: 5.659569 }; 
      const R_JORDA = 6378137;

      let panorama, scene, camera, renderer, masterGruppe;

      // Matematisk transformasjon: Konverterer Google GPS til absolutte meter (Web Mercator)
      function gpsTilMeter(lat, lng) {
        const x = lng * Math.PI / 180 * R_JORDA;
        const y = Math.log(Math.tan((90 + lat) * Math.PI / 360)) * R_JORDA;
        return { x: x, y: y };
      }

      // Matematisk transformasjon: Konverterer Civil 3D UTM direkte til Web Mercator
      function utmTilMeter(east, north) {
        const lngOrigo = 9.0; // Sentralmeridian for UTM Sone 32N
        const meterOrigo = gpsTilMeter(0.0, lngOrigo);
        const skremsfaktor = 1 / Math.cos(59.0003 * Math.PI / 180);
        
        return { 
          x: (east - 500000) * skremsfaktor + meterOrigo.x, 
          y: north * skremsfaktor 
        };
      }

      function initPlatform() {
        // Starter Google Street View og retter blikket rett mot kaikanten (heading: 240)
        panorama = new google.maps.StreetViewPanorama(
          document.getElementById("streetview-container"), {
            position: kameraStartGPS,
            pov: { heading: 240, pitch: 0 }, 
            zoom: 1,
            visible: true
          }
        );

        setupThreeJS();

        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        
        loader.load('25012 Tangen 7 - Nybygg.glb', function (gltf) {
          const modell = gltf.scene;
          modell.scale.set(1, 1, 1);
          
          // Siden "Flip YZ" ble slått AV under eksporten, retter vi opp 
          // aksene i 3D-scenen slik at Z-aksen peker loddrett oppover:
          modell.rotation.set(-Math.PI / 2, 0, 0);

          masterGruppe = new THREE.Group();
          masterGruppe.add(modell);
          
          // Roterer hele prosjektet rundt Civil 3D-merket i forhold til Sann Nord
          masterGruppe.rotation.set(0, 0, 0);
          masterGruppe.rotation.y = THREE.MathUtils.degToRad(CIVIL3D_ROTASJON_NORD);
          
          scene.add(masterGruppe);
          console.log("Den nye, georefererte modellen er lastet inn flatt og stabilt.");
          
          oppdaterByggPlassering();
          animate();
        }, undefined, function (error) {
          console.error("Feil under lasting av den nye GLB-filen:", error);
        });

        // Oppdaterer scenen automatisk hvis du forflytter deg eller snur deg i gata
        panorama.addListener('position_changed', () => oppdaterByggPlassering());
        panorama.addListener('pov_changed', () => updateCameraOrientation());
        panorama.addListener('zoom_changed', () => updateCameraOrientation());
      }

      function oppdaterByggPlassering() {
        if (!panorama || !masterGruppe) return;

        // 1. Hent kameraets nåværende posisjon
        const kamPos = panorama.getPosition();
        const kamMeter = gpsTilMeter(kamPos.lat(), kamPos.lng());
        
        // 2. Hent modellens sanne posisjon
        const origoMeter = utmTilMeter(CIVIL3D_ORIGO.east, CIVIL3D_ORIGO.north);

        // 3. Regn ut den nøyaktige forskyvningen i meter mellom deg og modellen
        const deltaX = origoMeter.x - kamMeter.x;
        const deltaZ = origoMeter.y - kamMeter.y;

        // 4. Nagler koordinatene fast til jordskorpa
        masterGruppe.position.set(deltaX, KOTE_NULL_HØYDE, -deltaZ);
        
        updateCameraOrientation();
      }

      function setupThreeJS() {
        const container = document.getElementById("streetview-container");
        scene = new THREE.Scene();
        
        // Setter opp godt arbeidslys på fasadene
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(30, 60, 30);
        scene.add(directionalLight);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
        
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '10';
        renderer.domElement.style.pointerEvents = 'none'; 
        
        container.appendChild(renderer.domElement);
        window.addEventListener('resize', onWindowResize);
      }

      function updateCameraOrientation() {
        if (!panorama || !camera) return;
        const pov = panorama.getPov();
        camera.rotation.set(THREE.MathUtils.degToRad(pov.pitch || 0), -THREE.MathUtils.degToRad(pov.heading || 0), 0, 'YXZ');
        camera.fov = 180 / Math.pow(2, panorama.getZoom() || 1);
        camera.updateProjectionMatrix();
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAKCY3L1KdO4oqxu_JVlCBkMCVHAcQOWNw&callback=initPlatform" async defer></script>
  </body>
</html>
