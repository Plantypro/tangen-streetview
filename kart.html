<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tangen 7 - Google Street View</title>
    <style>
      html, body, #streetview-container { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background-color: #000;
        overflow: hidden;
      }
    </style>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  </head>
  <body>
    <div id="streetview-container"></div>

    <script>
      // GPS-KOORDINATER FOR TANGEN, RANDABERG
      const prosjektPosisjon = { lat: 59.000383, lng: 5.659569 }; 

      let panorama, scene, camera, renderer, modell;

      function initPlatform() {
        // Start Street View
        panorama = new google.maps.StreetViewPanorama(
          document.getElementById("streetview-container"), {
            position: prosjektPosisjon,
            pov: { heading: 180, pitch: 0 }, 
            zoom: 1,
            visible: true
          }
        );

        setupThreeJS();

        // 2. Hjelpe-objekt: Vi setter opp en rød test-kube midt i veien!
        // Hvis du ser denne røde boksen, betyr det at 3D-motoren fungerer perfekt.
        const boksGeometri = new THREE.BoxGeometry(2, 2, 2);
        const boksMateriale = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: false });
        const testBoks = new THREE.Mesh(boksGeometri, boksMateriale);
        testBoks.position.set(0, 0, -10); // Plassert 10 meter foran kameraet
        scene.add(testBoks);

        // 3. Konfigurer og last inn din Revit/GLB-modell
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        
        loader.load('25012 Tangen 7 - Nybygg.glb', function (gltf) {
          modell = gltf.scene;
          
          // SKALERING: Hvis modellen ble bitteliten fra Revit, tvinger vi den opp i størrelse her
          // (Endre 1,1,1 til f.eks 10,10,10 hvis den er usynlig liten)
          modell.scale.set(1, 1, 1);
          
          // POSISJON: Flytter modellen 15 meter foran kameraet, og løfter den 1.5 meter opp fra asfalten
          modell.position.set(0, 1.5, -15); 
          
          // ROTASJON: Snu modellen (45 grader) på tomta
          modell.rotation.y = Math.PI * (45 / 180); 
          
          scene.add(modell);
          console.log("3D-modell laster suksessfullt!");
          animate();
        }, undefined, function (error) {
          console.error('Kunne ikke laste 3D-modellen:', error);
        });

        panorama.addListener('pov_changed', () => updateCameraOrientation());
        panorama.addListener('zoom_changed', () => updateCameraOrientation());
      }

      function setupThreeJS() {
        const container = document.getElementById("streetview-container");
        scene = new THREE.Scene();
        
        // Kraftig og godt lys fra alle kanter så modellen ikke blir mørk
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(20, 40, 20);
        scene.add(directionalLight);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // alpha: true gjør 3D-bakgrunnen gjennomsiktig så du ser Street View bak bygget
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0); // Tvinger full gjennomsiktighet
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.pointerEvents = 'none'; 
        container.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
        setTimeout(updateCameraOrientation, 500);
      }

      function updateCameraOrientation() {
        if (!panorama || !camera) return;
        const pov = panorama.getPov();
        if (!pov) return;

        const headingRad = THREE.MathUtils.degToRad(pov.heading || 0);
        const pitchRad = THREE.MathUtils.degToRad(pov.pitch || 0);

        camera.rotation.set(pitchRad, -headingRad, 0, 'YXZ');
        camera.fov = 180 / Math.pow(2, panorama.getZoom() || 1);
        camera.updateProjectionMatrix();
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    </script>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAKCY3L1KdO4oqxu_JVlCBkMCVHAcQOWNw&callback=initPlatform" async defer></script>
  </body>
</html>
