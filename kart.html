<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tangen 7 - Absolutt Georeferert</title>
    <style>
      html, body, #streetview-container { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background-color: #000;
        overflow: hidden;
      }
    </style>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  </head>
  <body>
    <div id="streetview-container"></div>

    <script>
      // ==========================================================
      // GEOGRAFISKE SPESIFIKASJONER FRA REVIT (UTM-32N / EPSG:25832)
      // ==========================================================
      // De eksakte koordinatene til Prosjekt-Nullpunktet fra tegningen din:
      const REVIT_ORIGO_UTM = { east: 307995.6157, north: 6544604.4177 };
      
      // Forskyvning av selve bygningskroppen (Aksekryss A / S1) internt i modellen din (i meter)
      const BYGG_OFFSET_X = 251.092;
      const BYGG_OFFSET_Y = 100.559;

      // Sann Nord-rotasjon fra Revit
      const BYGG_ROTASJON_NORD = 31.75; 

      // Startposisjon for Street View ute i veien (Tangen 7)
      const kameraStartGPS = { lat: 59.000383, lng: 5.659569 }; 

      // Jordens radius brukt til Web Mercator-projeksjon (EPSG:3857)
      const R_JORDA = 6378137;

      let panorama, scene, camera, renderer, bygningsGruppe;

      // Hjelpefunksjon for å konvertere GPS (WGS84) til flate meterkoordinater (Web Mercator)
      function gpsTilMeter(lat, lng) {
        const x = lng * Math.PI / 180 * R_JORDA;
        const y = Math.log(Math.tan((90 + lat) * Math.PI / 360)) * R_JORDA;
        return { x: x, y: y };
      }

      // Hjelpefunksjon for å konvertere UTM-32N direkte til Web Mercator-skalaen
      // Siden Tangen 7 ligger rundt 59°N, kalibrerer vi forholdet mellom UTM-aksene og Mercator-aksene
      function utmTilMeter(east, north) {
        // Sentralmeridian for UTM sone 32N er 9 grader øst
        const lngOrigo = 9.0;
        const latOrigo = 0.0;
        const meterOrigo = gpsTilMeter(latOrigo, lngOrigo);
        
        // Beregner skala-korreksjon for 59 grader nord
        const skremsfaktor = 1 / Math.cos(59.0003 * Math.PI / 180);
        
        // Transformerer og skalerer UTM-aksene slik at de matcher Three.js-verdenen lineært
        const x = (east - 500000) * skremsfaktor + meterOrigo.x;
        const y = north * skremsfaktor;
        return { x: x, y: y };
      }

      function initPlatform() {
        panorama = new google.maps.StreetViewPanorama(
          document.getElementById("streetview-container"), {
            position: kameraStartGPS,
            pov: { heading: 240, pitch: 0 }, 
            zoom: 1,
            visible: true
          }
        );

        setupThreeJS();

        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        
        loader.load('25012 Tangen 7 - Nybygg.glb', function (gltf) {
          const modell = gltf.scene;
          modell.scale.set(1, 1, 1);
          
          bygningsGruppe = new THREE.Group();
          
          // 1. Plasserer modellen slik at det interne Revit-nullpunktet lander nøyaktig i gruppens (0,0,0)
          modell.position.set(-BYGG_OFFSET_X, 0, -BYGG_OFFSET_Y);
          bygningsGruppe.add(modell);
          
          // 2. Roterer modellen flatt rundt sitt eget georefererte 0-punkt i forhold til Sann Nord
          bygningsGruppe.rotation.set(0, 0, 0);
          bygningsGruppe.rotation.y = THREE.MathUtils.degToRad(BYGG_ROTASJON_NORD);
          
          scene.add(bygningsGruppe);
          console.log("Modellen er låst til sitt absolutte geodetiske referansepunkt.");
          
          oppdaterByggPlassering();
          animate();
        }, undefined, function (error) {
          console.error("Feil under lasting av GLB-fil:", error);
        });
      }

      // DEN NYE ABSOLUTTE PLASSERINGSFUNKSJONEN: Nagler modellen fast til jordskorpa
      function oppdaterByggPlassering() {
        if (!panorama || !bygningsGruppe) return;

        // 1. Hent gjeldende GPS-posisjon til Street View-kameraet
        const kamPos = panorama.getPosition();
        const kamLat = kamPos.lat();
        const kamLng = kamPos.lng();

        // 2. Konverter kameraets posisjon til absolutte verdens-meter
        const kamMeter = gpsTilMeter(kamLat, kamLng);

        // 3. Konverter Revit sitt ekte 0-punkt (UTM) til absolutte verdens-meter
        const origoMeter = utmTilMeter(REVIT_ORIGO_UTM.east, REVIT_ORIGO_UTM.north);

        // 4. Regn ut den nøyaktige forskyvningen mellom deg og 0-punktet i den virkelige verden
        const deltaX = origoMeter.x - kamMeter.x;
        const deltaZ = origoMeter.y - kamMeter.y;

        // 5. Finn den korrekte høyden (Kote 0.00). Siden kote 0.00 er havnivå, 
        // og terrenget ved Tangen 7 ligger ca. 2.5 meter over havet, og kameraet er 1.6 meter over veien,
        // setter vi en absolutt kote-høyde her (justeres opp/ned ved behov)
        const KOTE_NULL_HØYDE = -4.1; 

        // Lås scenegruppen fast. Nå vil ikke modellen flytte på seg når du går!
        bygningsGruppe.position.set(deltaX, KOTE_NULL_HØYDE, -deltaZ);
        
        updateCameraOrientation();
      }

      function setupThreeJS() {
        const container = document.getElementById("streetview-container");
        scene = new THREE.Scene();
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(30, 60, 30);
        scene.add(directionalLight);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
        
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '10';
        renderer.domElement.style.pointerEvents = 'none'; 
        
        container.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
        
        if (panorama) {
          panorama.addListener('position_changed', () => oppdaterByggPlassering());
          panorama.addListener('pov_changed', () => updateCameraOrientation());
          panorama.addListener('zoom_changed', () => updateCameraOrientation());
        }
      }

      function updateCameraOrientation() {
        if (!panorama || !camera) return;
        const pov = panorama.getPov();
        if (!pov) return;

        camera.rotation.set(THREE.MathUtils.degToRad(pov.pitch || 0), -THREE.MathUtils.degToRad(pov.heading || 0), 0, 'YXZ');
        camera.fov = 180 / Math.pow(2, panorama.getZoom() || 1);
        camera.updateProjectionMatrix();
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    </script>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAKCY3L1KdO4oqxu_JVlCBkMCVHAcQOWNw&callback=initPlatform" async defer></script>
  </body>
</html>
