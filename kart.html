<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tangen 7 - Georeferert Street View</title>
    <style>
      html, body, #streetview-container { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background-color: #000;
        overflow: hidden;
      }
    </style>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  </head>
  <body>
    <div id="streetview-container"></div>

    <script>
      // ==========================================================
      // GEOGRAFISKE KOORDINATER FOR BYGGET (TANGEN 7)
      // ==========================================================
      const BYGG_GPS = { lat: 59.000450, lng: 5.659350 }; 
      const BYGG_HØYDE = -1.5; // Juster opp/ned for å treffe asfalten perfekt
      const BYGG_ROTASJON_NORD = 45; // Finjustering av retningen (i grader) på tomta
      
      // Startposisjon for Street View-kameraet (i gata utenfor)
      const kameraStartGPS = { lat: 59.000383, lng: 5.659569 }; 

      let panorama, scene, camera, renderer, modell;

      function initPlatform() {
        // Start Street View (Snyr kameraet mot gressplenen der nybygget skal stå)
        panorama = new google.maps.StreetViewPanorama(
          document.getElementById("streetview-container"), {
            position: kameraStartGPS,
            pov: { heading: 240, pitch: 0 }, 
            zoom: 1,
            visible: true
          }
        );

        setupThreeJS();

        // Konfigurer GLTF/DRACO-loader
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        
        loader.load('25012 Tangen 7 - Nybygg.glb', function (gltf) {
          modell = gltf.scene;
          
          // Senterer geometrien til (0,0,0) internt som sikkerhet
          const boks = new THREE.Box3().setFromObject(modell);
          const senter = new THREE.Vector3();
          boks.getCenter(senter);
          modell.position.x += (modell.position.x - senter.x);
          modell.position.y += (modell.position.y - boks.min.y); 
          modell.position.z += (modell.position.z - senter.z);
          
          // ==========================================================
          // AKSE-KORRIGERING (Fikser 90 graders feilen fra Revit/Leia)
          // ==========================================================
          // Snyr modellen 90 grader rundt X-aksen for å reise den opp på beina
          modell.rotation.x = Math.PI * (90 / 180); 
          
          // Legger til den ordinære tomterotasjonen på Y-aksen
          modell.rotation.y = Math.PI * (BYGG_ROTASJON_NORD / 180); 
          
          scene.add(modell);
          
          // Plasser geografisk
          oppdaterByggPlassering();
          
          animate();
        }, undefined, function (error) {
          console.error("Feil under lasting av GLB-fil:", error);
        });

        // Event listeners for posisjonsendringer
        panorama.addListener('position_changed', () => {
          oppdaterByggPlassering(); 
        });

        panorama.addListener('pov_changed', () => {
          updateCameraOrientation();
        });
        
        panorama.addListener('zoom_changed', () => {
          updateCameraOrientation();
        });
      }

      function oppdaterByggPlassering() {
        if (!panorama || !modell) return;

        const kamPos = panorama.getPosition();
        const kamLat = kamPos.lat();
        const kamLng = kamPos.lng();

        const R = 6378137; 

        const dLat = THREE.MathUtils.degToRad(BYGG_GPS.lat - kamLat);
        const dLng = THREE.MathUtils.degToRad(BYGG_GPS.lng - kamLng);

        const meterNord = dLat * R;
        const meterØst = dLng * R * Math.cos(THREE.MathUtils.degToRad(kamLat));

        // Plasserer i Three.js koordinatsystem
        modell.position.set(meterØst, BYGG_HØYDE, -meterNord);
        
        updateCameraOrientation();
      }

      function setupThreeJS() {
        const container = document.getElementById("streetview-container");
        scene = new THREE.Scene();
        
        // Kraftig lyssetting for å lyse opp alle flater etter rotasjonen
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(30, 60, 30);
        scene.add(directionalLight);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '10';
        renderer.domElement.style.pointerEvents = 'none'; 
        
        container.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
      }

      function updateCameraOrientation() {
        if (!panorama || !camera) return;
        const pov = panorama.getPov();
        if (!pov) return;

        const headingRad = THREE.MathUtils.degToRad(pov.heading || 0);
        const pitchRad = THREE.MathUtils.degToRad(pov.pitch || 0);

        camera.rotation.set(pitchRad, -headingRad, 0, 'YXZ');
        camera.fov = 180 / Math.pow(2, panorama.getZoom() || 1);
        camera.updateProjectionMatrix();
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    </script>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAKCY3L1KdO4oqxu_JVlCBkMCVHAcQOWNw&callback=initPlatform" async defer></script>
  </body>
</html>
