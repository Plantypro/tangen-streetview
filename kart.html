<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tangen 7 - Stabilisert 2D/3D</title>
    <style>
      html, body { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background-color: #111;
        font-family: sans-serif;
        overflow: hidden;
      }
      /* Tydelig splittelse av skjermen */
      #streetview-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
        background-color: #1a1a1a;
      }
      #map-container {
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 100%;
        border-left: 2px solid #444;
        background-color: #222;
      }
      #control-panel {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: rgba(0, 0, 0, 0.9);
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 13px;
        display: flex;
        gap: 15px;
      }
      .coordinate-box {
        font-family: monospace;
        color: #00ffcc;
      }
      #error-log {
        position: absolute;
        bottom: 10px;
        right: 10px;
        z-index: 1000;
        background: rgba(255, 0, 0, 0.9);
        color: white;
        padding: 10px;
        border-radius: 4px;
        font-size: 12px;
        max-width: 40%;
        display: none;
      }
    </style>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  </head>
  <body>

    <div id="control-panel">
      <div><b>Modell Status:</b> <span id="txt-status" style="color: #ffcc00;">Laster inn...</span></div>
      <div>|</div>
      <div><b>Høyde (kote):</b> <span id="txt-høyde" class="coordinate-box">-3.5m</span></div>
    </div>

    <div id="error-log"></div>

    <div id="streetview-container"></div>
    <div id="map-container"></div>

    <script>
      // Automatisk feilfanger som forteller oss nøyaktig hva som krasjer på skjermen
      window.onerror = function(msg, url, line) {
        const logBox = document.getElementById('error-log');
        logBox.style.display = 'block';
        logBox.innerHTML += `<div><b>Feil:</b> ${msg} <br><small>Linje ${line}</small></div>`;
        return false;
      };

      // Sanne, absolutte Civil 3D koordinater (UTM-32N)
      const CIVIL3D_ORIGO = { east: 307995.6157, north: 6544604.4177 };
      const CIVIL3D_ROTASJON_NORD = 31.75; 
      
      let byggHøyde = -3.5; 
      const kameraStartGPS = { lat: 59.000383, lng: 5.659569 }; 
      const R_JORDA = 6378137;

      let panorama, map, scene, camera, renderer, masterGruppe;

      function gpsTilMeter(lat, lng) {
        const x = lng * Math.PI / 180 * R_JORDA;
        const y = Math.log(Math.tan((90 + lat) * Math.PI / 360)) * R_JORDA;
        return { x: x, y: y };
      }

      function utmTilMeter(east, north) {
        const lngOrigo = 9.0; 
        const meterOrigo = gpsTilMeter(0.0, lngOrigo);
        const skremsfaktor = 1 / Math.cos(59.0003 * Math.PI / 180);
        return { 
          x: (east - 500000) * skremsfaktor + meterOrigo.x, 
          y: north * skremsfaktor 
        };
      }

      function initPlatform() {
        // 1. Last inn Street View på venstre side
        panorama = new google.maps.StreetViewPanorama(
          document.getElementById("streetview-container"), {
            position: kameraStartGPS,
            pov: { heading: 240, pitch: 0 }, 
            zoom: 1,
            visible: true
          }
        );

        // 2. Last inn Satellittkart på høyre side
        map = new google.maps.Map(document.getElementById("map-container"), {
          center: { lat: 59.000200, lng: 5.659400 },
          zoom: 18,
          mapTypeId: 'satellite'
        });

        setupThreeJS();

        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        
        loader.load('25012 Tangen 7 - Nybygg.glb', function (gltf) {
          const modell = gltf.scene;
          modell.scale.set(1, 1, 1);
          
          // Siden "Flip YZ" er slått av i Leia, setter vi den flatt her:
          modell.rotation.set(-Math.PI / 2, 0, 0);

          masterGruppe = new THREE.Group();
          masterGruppe.add(modell);
          
          // Setter rotasjon rundt det sanne kartkompasset
          masterGruppe.rotation.set(0, 0, 0);
          masterGruppe.rotation.y = THREE.MathUtils.degToRad(CIVIL3D_ROTASJON_NORD);
          
          scene.add(masterGruppe);
          document.getElementById("txt-status").innerText = "Suksess!";
          document.getElementById("txt-status").style.color = "#00ffaa";
          
          oppdaterByggPlassering();
          animate();
        }, undefined, function (error) {
          console.error("Feil under lasting av 3D-fil:", error);
          document.getElementById("txt-status").innerText = "Modellfeil!";
          document.getElementById("txt-status").style.color = "#ff3333";
        });

        panorama.addListener('position_changed', () => oppdaterByggPlassering());
        panorama.addListener('pov_changed', () => updateCameraOrientation());
        panorama.addListener('zoom_changed', () => updateCameraOrientation());
      }

      function oppdaterByggPlassering() {
        if (!panorama || !masterGruppe) return;

        const kamPos = panorama.getPosition();
        const kamMeter = gpsTilMeter(kamPos.lat(), kamPos.lng());
        const origoMeter = utmTilMeter(CIVIL3D_ORIGO.east, CIVIL3D_ORIGO.north);

        const deltaX = origoMeter.x - kamMeter.x;
        const deltaZ = origoMeter.y - kamMeter.y;

        masterGruppe.position.set(deltaX, byggHøyde, -deltaZ);
      }

      function setupThreeJS() {
        const container = document.getElementById("streetview-container");
        scene = new THREE.Scene();
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(30, 60, 30);
        scene.add(directionalLight);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / 2 / window.innerHeight, 0.1, 5000);
        
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0); 
        renderer.setSize(window.innerWidth / 2, window.innerHeight);
        
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '10';
        renderer.domElement.style.pointerEvents = 'none'; 
        
        container.appendChild(renderer.domElement);
        window.addEventListener('resize', onWindowResize);
      }

      function updateCameraOrientation() {
        if (!panorama || !camera) return;
        const pov = panorama.getPov();
        camera.rotation.set(THREE.MathUtils.degToRad(pov.pitch || 0), -THREE.MathUtils.degToRad(pov.heading || 0), 0, 'YXZ');
        camera.fov = 180 / Math.pow(2, panorama.getZoom() || 1);
        camera.updateProjectionMatrix();
      }

      function onWindowResize() {
        camera.aspect = (window.innerWidth / 2) / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth / 2, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAKCY3L1KdO4oqxu_JVlCBkMCVHAcQOWNw&callback=initPlatform" async defer></script>
  </body>
</html>
