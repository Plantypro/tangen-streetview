<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tangen 7 - Google Street View</title>
    <style>
      html, body, #streetview-container { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background-color: #000;
        overflow: hidden;
      }
    </style>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  </head>
  <body>
    <div id="streetview-container"></div>

    <script>
      // GPS-KOORDINATER FOR TANGEN, RANDABERG
      const prosjektPosisjon = { lat: 59.000383, lng: 5.659569 }; 

      let panorama, scene, camera, renderer, modell;

      function initPlatform() {
        // Start Street View
        panorama = new google.maps.StreetViewPanorama(
          document.getElementById("streetview-container"), {
            position: prosjektPosisjon,
            pov: { heading: 180, pitch: 0 }, 
            zoom: 1,
            visible: true
          }
        );

        setupThreeJS();

        // 2. Vi lager en ENORM rød test-boks (5x5x5 meter) plassert 8 meter foran deg
        const boksGeometri = new THREE.BoxGeometry(5, 5, 5);
        const boksMateriale = new THREE.MeshBasicMaterial({ color: 0xff0000, depthTest: true });
        const testBoks = new THREE.Mesh(boksGeometri, boksMateriale);
        testBoks.position.set(0, 0, -8); 
        scene.add(testBoks);

        // 3. Konfigurer GLTF/DRACO-loader
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        
        loader.load('25012 Tangen 7 - Nybygg.glb', function (gltf) {
          modell = gltf.scene;
          
          // Siden du har "Relocate to 0", tvinger vi den 12 meter frem i gata så den står rett bak boksen
          modell.position.set(0, 0, -12); 
          
          // Juster rotasjon
          modell.rotation.y = Math.PI * (45 / 180); 
          
          scene.add(modell);
          console.log("Revit-modellen er lagt til i scenen!");
          animate();
        }, undefined, function (error) {
          console.error('Kunne ikke laste 3D-modellen:', error);
        });

        panorama.addListener('pov_changed', () => updateCameraOrientation());
        panorama.addListener('zoom_changed', () => updateCameraOrientation());
      }

      function setupThreeJS() {
        const container = document.getElementById("streetview-container");
        scene = new THREE.Scene();
        
        // Ekstra kraftig belysning
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(10, 50, 15);
        scene.add(directionalLight);

        // Nærgrensen (near) er satt til 0.1 for å hindre at ting rett foran kameraet blir borte
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0); // Gjør bakgrunnen 100 % gjennomsiktig
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        // KRITISK: Tvinger 3D-laget til å ligge absolutt øverst (z-index: 10) over Google Maps-bildet
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '10';
        renderer.domElement.style.pointerEvents = 'none'; 
        
        container.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
        setTimeout(updateCameraOrientation, 500);
      }

      function updateCameraOrientation() {
        if (!panorama || !camera) return;
        const pov = panorama.getPov();
        if (!pov) return;

        const headingRad = THREE.MathUtils.degToRad(pov.heading || 0);
        const pitchRad = THREE.MathUtils.degToRad(pov.pitch || 0);

        camera.rotation.set(pitchRad, -headingRad, 0, 'YXZ');
        camera.fov = 180 / Math.pow(2, panorama.getZoom() || 1);
        camera.updateProjectionMatrix();
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    </script>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAKCY3L1KdO4oqxu_JVlCBkMCVHAcQOWNw&callback=initPlatform" async defer></script>
  </body>
</html>
