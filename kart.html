<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tangen 7 - Sentrert og Låst Kalibrering</title>
    <style>
      html, body { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background-color: #000;
        font-family: sans-serif;
      }
      #streetview-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
      }
      #map-container {
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 100%;
        border-left: 3px solid #333;
      }
      #control-panel {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: rgba(0, 0, 0, 0.9);
        color: #fff;
        padding: 12px 20px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        font-size: 13px;
        display: flex;
        gap: 15px;
      }
      .coordinate-box {
        font-family: monospace;
        color: #00ffcc;
      }
      #instructions {
        position: absolute;
        bottom: 20px;
        left: 20px;
        z-index: 999;
        background: rgba(0,0,0,0.8);
        color: #fff;
        padding: 10px;
        border-radius: 5px;
        font-size: 11px;
      }
    </style>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  </head>
  <body>

    <div id="control-panel">
      <div><b>Markør GPS:</b> <span id="txt-lat" class="coordinate-box">Søker...</span>, <span id="txt-lng" class="coordinate-box">Søker...</span></div>
      <div>|</div>
      <div><b>Høyde (kote):</b> <span id="txt-høyde" class="coordinate-box">-1.6m</span></div>
    </div>

    <div id="instructions">
      <b>Tastaturkontroll:</b><br>
      Bruk <b>Piltastene</b> for å flytte det blå omrisset millimeter-presist.<br>
      Bruk <b>PageUp / PageDown</b> for å heve eller senke høyden!
    </div>

    <div id="streetview-container"></div>
    <div id="map-container"></div>

    <script>
      // ==========================================================
      // GEOGRAFISKE DATA FRA REVIT (TANGEN 7) - LÅST
      // ==========================================================
      // Justert startposisjon midt på plenen for Tangen 7
      let byggGPS = { lat: 59.000300, lng: 5.659300 }; 
      let byggHøyde = -1.6; 
      const BYGG_ROTASJON_NORD = 31.75; // Sann Nord fra kompasset ditt

      const kameraStartGPS = { lat: 59.000383, lng: 5.659569 }; 

      let panorama, map, byggMarkør, bygg2DOmriss, scene, camera, renderer, bygningsGruppe;

      function initPlatform() {
        panorama = new google.maps.StreetViewPanorama(
          document.getElementById("streetview-container"), {
            position: kameraStartGPS,
            pov: { heading: 240, pitch: 0 }, 
            zoom: 1,
            visible: true
          }
        );

        map = new google.maps.Map(document.getElementById("map-container"), {
          center: byggGPS,
          zoom: 19,
          mapTypeId: 'satellite'
        });

        byggMarkør = new google.maps.Marker({
          position: byggGPS,
          map: map,
          draggable: true,
          title: "Dra for å flytte bygget"
        });

        // Blått 2D-omriss for å visualisere tomta på satellittkartet
        bygg2DOmriss = new google.maps.Polygon({
          strokeColor: "#00aaff",
          strokeOpacity: 0.8,
          strokeWeight: 3,
          fillColor: "#00aaff",
          fillOpacity: 0.25,
          map: map
        });

        setupThreeJS();

        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        
        loader.load('25012 Tangen 7 - Nybygg.glb', function (gltf) {
          const modell = gltf.scene;
          
          // MÅLESTOKK (Beholdes 1:1 meter fra Leia)
          modell.scale.set(1, 1, 1);
          
          bygningsGruppe = new THREE.Group();
          
          // ==========================================================
          // KRITISK: AUTOMATISK MÅLING OG SENTRERING AV SELVE BYGGET
          // ==========================================================
          // Vi tvinger kote 0.00 til å ligge flatt (YZ-flipping)
          modell.rotation.x = -Math.PI / 2; 
          
          // Vi måler den faktiske 3D-boksen til selve bygningsmassen din
          const boks = new THREE.Box3().setFromObject(modell);
          const senter = new THREE.Vector3();
          boks.getCenter(senter);
          
          // Vi flytter lokalgeometrien slik at byggets midtpunkt er (0,0,0)
          // Da kaster vi ut effekten av det fjerne Revit-nullpunktet!
          modell.position.x = -senter.x;
          modell.position.y = -boks.min.y; // Tvinger bunnen av huset til å starte på 0
          modell.position.z = -senter.z;
          bygningsGruppe.add(modell);
          
          // Ren horisontal kompassrotasjon rundt det nye, sentrerte midtpunktet
          bygningsGruppe.rotation.set(0, 0, 0);
          bygningsGruppe.rotation.y = THREE.MathUtils.degToRad(BYGG_ROTASJON_NORD);
          
          scene.add(bygningsGruppe);
          console.log("Bygget er sentrert, låst, lagt flatt og klargjort.");
          
          oppdaterPosisjonOgKart();
          setupKeyboardControls();
          animate();
        }, undefined, function (error) {
          console.error("Feil under lasting av GLB-fil:", error);
        });

        byggMarkør.addListener('drag', function(event) {
          byggGPS.lat = event.latLng.lat();
          byggGPS.lng = event.latLng.lng();
          oppdaterPosisjonOgKart();
        });

        panorama.addListener('pov_changed', () => updateCameraOrientation());
        panorama.addListener('zoom_changed', () => updateCameraOrientation());
      }

      function oppdaterPosisjonOgKart() {
        document.getElementById("txt-lat").innerText = byggGPS.lat.toFixed(6);
        document.getElementById("txt-lng").innerText = byggGPS.lng.toFixed(6);
        document.getElementById("txt-høyde").innerText = byggHøyde.toFixed(1) + "m";

        if (panorama && bygningsGruppe) {
          const kamPos = panorama.getPosition();
          const R = 6378137; 
          const dLat = THREE.MathUtils.degToRad(byggGPS.lat - kamPos.lat());
          const dLng = THREE.MathUtils.degToRad(byggGPS.lng - kamPos.lng());
          const meterNord = dLat * R;
          const meterØst = dLng * R * Math.cos(THREE.MathUtils.degToRad(kamPos.lat()));
          
          bygningsGruppe.position.set(meterØst, byggHøyde, -meterNord);
        }

        // Tegner 2D-polygonen på kartet etter målene fra din røde tegning
        const vinkelRad = THREE.MathUtils.degToRad(BYGG_ROTASJON_NORD);
        const latMeter = 111132; 
        const lngMeter = 40075000 * Math.cos(THREE.MathUtils.degToRad(byggGPS.lat)) / 360;

        // Dimensjoner kalibrert etter tegningen din (ca. 160m lang kailinje, 60m bredde)
        const l = 160; 
        const b = 60; 

        const hjørner = [
          { dx: -b/2, dy: -l/2 },
          { dx: b/2, dy: -l/2 },
          { dx: b/2, dy: l/2 },
          { dx: -b/2, dy: l/2 }
        ];

        const polygonStier = hjørner.map(h => {
          const rx = h.dx * Math.cos(vinkelRad) - h.dy * Math.sin(vinkelRad);
          const ry = h.dx * Math.sin(vinkelRad) + h.dy * Math.cos(vinkelRad);
          return {
            lat: byggGPS.lat + (ry / latMeter),
            lng: byggGPS.lng + (rx / lngMeter)
          };
        });

        bygg2DOmriss.setPaths(polygonStier);
        byggMarkør.setPosition(byggGPS);
      }

      // ==========================================================
      // LIVE FINJUSTERING MED TASTAURET
      // ==========================================================
      function setupKeyboardControls() {
        window.addEventListener('keydown', function(e) {
          const stegGPS = 0.000002; 
          
          if (e.key === 'ArrowUp') { byggGPS.lat += stegGPS; e.preventDefault(); }
          if (e.key === 'ArrowDown') { byggGPS.lat -= stegGPS; e.preventDefault(); }
          if (e.key === 'ArrowLeft') { byggGPS.lng -= stegGPS; e.preventDefault(); }
          if (e.key === 'ArrowRight') { byggGPS.lng += stegGPS; e.preventDefault(); }
          
          if (e.key === 'PageUp') { byggHøyde += 0.2; e.preventDefault(); }
          if (e.key === 'PageDown') { byggHøyde -= 0.2; e.preventDefault(); }

          oppdaterPosisjonOgKart();
        });
      }

      function setupThreeJS() {
        const container = document.getElementById("streetview-container");
        scene = new THREE.Scene();
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(30, 60, 30);
        scene.add(directionalLight);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / 2 / window.innerHeight, 0.1, 5000);
        
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0); 
        renderer.setSize(window.innerWidth / 2, window.innerHeight);
        
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '10';
        renderer.domElement.style.pointerEvents = 'none'; 
        
        container.appendChild(renderer.domElement);
        window.addEventListener('resize', onWindowResize);
      }

      function updateCameraOrientation() {
        if (!panorama || !camera) return;
        const pov = panorama.getPov();
        camera.rotation.set(THREE.MathUtils.degToRad(pov.pitch || 0), -THREE.MathUtils.degToRad(pov.heading || 0), 0, 'YXZ');
        camera.fov = 180 / Math.pow(2, panorama.getZoom() || 1);
        camera.updateProjectionMatrix();
      }

      function onWindowResize() {
        camera.aspect = (window.innerWidth / 2) / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth / 2, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAKCY3L1KdO4oqxu_JVlCBkMCVHAcQOWNw&callback=initPlatform" async defer></script>
  </body>
</html>
