<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tangen 7 - Presisjonskalibrering</title>
    <style>
      html, body { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background-color: #000;
        font-family: sans-serif;
        overflow: hidden;
      }
      #streetview-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
        background-color: #1a1a1a;
      }
      #map-container {
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 100%;
        border-left: 2px solid #444;
        background-color: #222;
      }
      #control-panel {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: rgba(0, 0, 0, 0.9);
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 13px;
        display: flex;
        gap: 15px;
      }
      .coordinate-box {
        font-family: monospace;
        color: #00ffcc;
      }
      #instructions {
        position: absolute;
        bottom: 20px;
        left: 20px;
        z-index: 999;
        background: rgba(0,0,0,0.85);
        color: #fff;
        padding: 12px;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  </head>
  <body>

    <div id="control-panel">
      <div><b>Siste handling:</b> <span id="txt-status" style="color: #00ffaa;">Klar</span></div>
      <div>|</div>
      <div><b>Høyde (kote):</b> <span id="txt-høyde" class="coordinate-box">-3.50m</span></div>
      <div>|</div>
      <div><b>Anker GPS:</b> <span id="txt-lat" class="coordinate-box">59.000080</span>, <span id="txt-lng" class="coordinate-box">5.659320</span></div>
    </div>

    <div id="instructions">
      <b>Låst tastaturkontroll (Ingen taster må holdes inne):</b><br>
      • Klikk hvor som helst på skjermen.<br>
      • <b>Piltastene</b> flytter modellen med nøyaktig <b>1.0 meter</b> av gangen.<br>
      • <b>PageUp / PageDown</b> endrer høyden med nøyaktig <b>10 cm</b> av gangen.
    </div>

    <div id="streetview-container"></div>
    <div id="map-container"></div>

    <script>
      let origoGPS = { lat: 59.000080, lng: 5.659320 }; 
      let globalHøyde = -3.50; 
      const CIVIL3D_ROTASJON_NORD = 31.75; 

      const REVIT_OFFSET_X = 251.092; 
      const REVIT_OFFSET_Y = 100.559; 

      const kameraStartGPS = { lat: 59.000383, lng: 5.659569 }; 
      const R_JORDA = 6378137;

      let panorama, map, origoMarkør, bygg2DOmriss, scene, camera, renderer, bygningsGruppe;

      function gpsTilMeter(lat, lng) {
        const x = lng * Math.PI / 180 * R_JORDA;
        const y = Math.log(Math.tan((90 + lat) * Math.PI / 360)) * R_JORDA;
        return { x: x, y: y };
      }

      function initPlatform() {
        panorama = new google.maps.StreetViewPanorama(
          document.getElementById("streetview-container"), {
            position: kameraStartGPS,
            pov: { heading: 140, pitch: 0 }, 
            zoom: 1,
            visible: true
          }
        );

        map = new google.maps.Map(document.getElementById("map-container"), {
          center: { lat: 59.000150, lng: 5.659500 },
          zoom: 18,
          mapTypeId: 'satellite'
        });

        origoMarkør = new google.maps.Marker({
          position: origoGPS,
          map: map,
          draggable: true,
          title: "Civil 3D Origo"
        });

        bygg2DOmriss = new google.maps.Polygon({
          strokeColor: "#00aaff",
          strokeOpacity: 0.8,
          strokeWeight: 3,
          fillColor: "#00aaff",
          fillOpacity: 0.25,
          map: map
        });

        setupThreeJS();

        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        
        loader.load('25012 Tangen 7 - Nybygg.glb', function (gltf) {
          const modell = gltf.scene;
          modell.scale.set(1, 1, 1);
          
          bygningsGruppe = new THREE.Group();
          modell.rotation.set(0, 0, 0);
          bygningsGruppe.add(modell);
          
          bygningsGruppe.rotation.set(0, 0, 0);
          bygningsGruppe.rotation.y = THREE.MathUtils.degToRad(CIVIL3D_ROTASJON_NORD);
          
          scene.add(bygningsGruppe);
          
          opprettHjelpelinje();
          oppdaterGeometriPosisjon();
          setupKeyboardControls();
          animate();
        });

        origoMarkør.addListener('drag', function(event) {
          origoGPS.lat = event.latLng.lat();
          origoGPS.lng = event.latLng.lng();
          document.getElementById("txt-status").innerText = "Drar markør via kart";
          oppdaterGeometriPosisjon();
        });

        panorama.addListener('pov_changed', () => updateCameraOrientation());
        panorama.addListener('zoom_changed', () => updateCameraOrientation());
      }

      function opprettHjelpelinje() {
        const materiale = new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 4 });
        const punkter = [];
        punkter.push(new THREE.Vector3(0, -20, 0));
        punkter.push(new THREE.Vector3(0, 100, 0)); 
        const geometri = new THREE.BufferGeometry().setFromPoints(punkter);
        const linje = new THREE.Line(geometri, materiale);
        scene.add(linje);
      }

      function oppdaterGeometriPosisjon() {
        document.getElementById("txt-lat").innerText = origoGPS.lat.toFixed(6);
        document.getElementById("txt-lng").innerText = origoGPS.lng.toFixed(6);
        document.getElementById("txt-høyde").innerText = globalHøyde.toFixed(2) + "m";

        if (panorama && bygningsGruppe) {
          const kamPos = panorama.getPosition();
          const R = 6378137; 
          const dLat = THREE.MathUtils.degToRad(origoGPS.lat - kamPos.lat());
          const dLng = THREE.MathUtils.degToRad(origoGPS.lng - kamPos.lng());
          const meterNord = dLat * R;
          const meterØst = dLng * R * Math.cos(THREE.MathUtils.degToRad(kamPos.lat()));
          
          bygningsGruppe.position.set(meterØst, globalHøyde, -meterNord);
        }

        const vinkelRad = THREE.MathUtils.degToRad(CIVIL3D_ROTASJON_NORD);
        const latMeter = 111132; 
        const lngMeter = 40075000 * Math.cos(THREE.MathUtils.degToRad(origoGPS.lat)) / 360;

        const senter2D = {
          lat: origoGPS.lat + ((REVIT_OFFSET_Y * Math.cos(vinkelRad) + REVIT_OFFSET_X * Math.sin(vinkelRad)) / latMeter),
          lng: origoGPS.lng + ((-REVIT_OFFSET_Y * Math.sin(vinkelRad) + REVIT_OFFSET_X * Math.cos(vinkelRad)) / lngMeter)
        };

        const l = 155; 
        const b = 58; 

        const hjørner = [
          { dx: -b/2, dy: -l/2 },
          { dx: b/2, dy: -l/2 },
          { dx: b/2, dy: l/2 },
          { dx: -b/2, dy: l/2 }
        ];

        const polygonStier = hjørner.map(h => {
          const rx = h.dx * Math.cos(vinkelRad) - h.dy * Math.sin(vinkelRad);
          const ry = h.dx * Math.sin(vinkelRad) + h.dy * Math.cos(vinkelRad);
          return {
            lat: senter2D.lat + (ry / latMeter),
            lng: senter2D.lng + (rx / lngMeter)
          };
        });

        bygg2DOmriss.setPaths(polygonStier);
        origoMarkør.setPosition(origoGPS);
      }

      // ==========================================================
      // STRIDSKLAR TASTASTURSTYRING: 1 METER OG 10 CM
      // ==========================================================
      function setupKeyboardControls() {
        // Vi tvinger lytteren til å overvåke hele vinduet (window) uansett hvor Google har fokus
        window.addEventListener('keydown', function(e) {
          // Matematisk omregning fra meter til GPS-grader basert på Tangen 7 sin breddegrad
          const enMeterILat = 1.0 / 111132;
          const enMeterILng = 1.0 / (40075000 * Math.cos(THREE.MathUtils.degToRad(origoGPS.lat)) / 360);
          
          let loggTekst = "";

          if (e.key === 'ArrowUp') { 
            origoGPS.lat += enMeterILat; 
            loggTekst = "Flyttet 1 meter Nord";
            e.preventDefault(); 
          }
          if (e.key === 'ArrowDown') { 
            origoGPS.lat -= enMeterILat; 
            loggTekst = "Flyttet 1 meter Sør";
            e.preventDefault(); 
          }
          if (e.key === 'ArrowLeft') { 
            origoGPS.lng -= enMeterILng; 
            loggTekst = "Flyttet 1 meter Vest";
            e.preventDefault(); 
          }
          if (e.key === 'ArrowRight') { 
            origoGPS.lng += enMeterILng; 
            loggTekst = "Flyttet 1 meter Øst";
            e.preventDefault(); 
          }
          
          // Heving og senking med nøyaktig 10 cm (0.10 meter)
          if (e.key === 'PageUp') { 
            globalHøyde += 0.10; 
            loggTekst = "Hevet 10 cm";
            e.preventDefault(); 
          }
          if (e.key === 'PageDown') { 
            globalHøyde -= 0.10; 
            loggTekst = "Senket 10 cm";
            e.preventDefault(); 
          }

          if (loggTekst !== "") {
            document.getElementById("txt-status").innerText = loggTekst;
            oppdaterGeometriPosisjon();
          }
        }, true); // 'true' gjør at koden fanger opp trykket før Google Street View rekker å stjele det
      }

      function setupThreeJS() {
        const container = document.getElementById("streetview-container");
        scene = new THREE.Scene();
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(30, 60, 30);
        scene.add(directionalLight);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / 2 / window.innerHeight, 0.1, 5000);
        
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0); 
        renderer.setSize(window.innerWidth / 2, window.innerHeight);
        
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '10';
        renderer.domElement.style.pointerEvents = 'none'; 
        
        container.appendChild(renderer.domElement);
        window.addEventListener('resize', onWindowResize);
      }

      function updateCameraOrientation() {
        if (!panorama || !camera) return;
        const pov = panorama.getPov();
        camera.rotation.set(THREE.MathUtils.degToRad(pov.pitch || 0), -THREE.MathUtils.degToRad(pov.heading || 0), 0, 'YXZ');
        camera.fov = 180 / Math.pow(2, panorama.getZoom() || 1);
        camera.updateProjectionMatrix();
      }

      function onWindowResize() {
        camera.aspect = (window.innerWidth / 2) / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth / 2, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAKCY3L1KdO4oqxu_JVlCBkMCVHAcQOWNw&callback=initPlatform" async defer></script>
  </body>
</html>
