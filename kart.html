<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tangen 7 - Senket Grunnflate</title>
    <style>
      html, body, #streetview-container { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background-color: #000;
        overflow: hidden;
      }
    </style>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  </head>
  <body>
    <div id="streetview-container"></div>

    <script>
      // ==========================================================
      // GEOGRAFISKE DATA FRA REVIT (TANGEN 7)
      // ==========================================================
      const BYGG_GPS = { lat: 59.000320, lng: 5.659300 }; 
      
      // KRAFTIG SENKET: Satt til -35 meter for å tvinge alt det hvite under bakken
      const BYGG_HØYDE = -35.0; 
      
      const BYGG_ROTASJON_NORD = 31.75; 

      // Eksakte forskyvninger fra Revit-nullpunktet ditt (i meter)
      const REVIT_OFFSET_X = 251.092; 
      const REVIT_OFFSET_Y = 100.559; 

      const kameraStartGPS = { lat: 59.000383, lng: 5.659569 }; 

      let panorama, scene, camera, renderer, bygningsGruppe;

      function initPlatform() {
        panorama = new google.maps.StreetViewPanorama(
          document.getElementById("streetview-container"), {
            position: kameraStartGPS,
            pov: { heading: 240, pitch: 0 }, 
            zoom: 1,
            visible: true
          }
        );

        setupThreeJS();

        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        
        loader.load('25012 Tangen 7 - Nybygg.glb', function (gltf) {
          const modell = gltf.scene;
          modell.scale.set(1, 1, 1);
          
          bygningsGruppe = new THREE.Group();
          
          // Flytter modellen i forhold til Revit-origo
          modell.position.set(-REVIT_OFFSET_X, 0, -REVIT_OFFSET_Y);
          bygningsGruppe.add(modell);
          
          // Ren flat rotasjon rundt aksekrysset
          bygningsGruppe.rotation.set(0, 0, 0);
          bygningsGruppe.rotation.y = THREE.MathUtils.degToRad(BYGG_ROTASJON_NORD);
          
          scene.add(bygningsGruppe);
          console.log("Modellen er dyttet dypt ned under terrenget for klargjøring.");
          
          opprettHjelpelinje();
          oppdaterByggPlassering();
          animate();
        }, undefined, function (error) {
          console.error("Feil under lasting av GLB-fil:", error);
        });
      }

      function opprettHjelpelinje() {
        const materiale = new THREE.LineBasicMaterial({ color: 0xff0000 });
        const punkter = [];
        punkter.push(new THREE.Vector3(0, -40, 0));
        punkter.push(new THREE.Vector3(0, 40, 0)); 
        const geometri = new THREE.BufferGeometry().setFromPoints(punkter);
        const linje = new THREE.Line(geometri, materiale);
        scene.add(linje);
      }

      function oppdaterByggPlassering() {
        if (!panorama || !bygningsGruppe) return;

        const kamPos = panorama.getPosition();
        const R = 6378137; 

        const dLat = THREE.MathUtils.degToRad(BYGG_GPS.lat - kamPos.lat());
        const dLng = THREE.MathUtils.degToRad(BYGG_GPS.lng - kamPos.lng());

        const meterNord = dLat * R;
        const meterØst = dLng * R * Math.cos(THREE.MathUtils.degToRad(kamPos.lat()));

        // Posisjonerer modellen i 3D-rommet
        bygningsGruppe.position.set(meterØst, BYGG_HØYDE, -meterNord);
        
        updateCameraOrientation();
      }

      function setupThreeJS() {
        const container = document.getElementById("streetview-container");
        scene = new THREE.Scene();
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(30, 60, 30);
        scene.add(directionalLight);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '10';
        renderer.domElement.style.pointerEvents = 'none'; 
        
        container.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
        
        if (panorama) {
          panorama.addListener('position_changed', () => oppdaterByggPlassering());
          panorama.addListener('pov_changed', () => updateCameraOrientation());
          panorama.addListener('zoom_changed', () => updateCameraOrientation());
