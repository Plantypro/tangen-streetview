<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tangen 7 - Civil 3D Georeferert</title>
    <style>
      html, body { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background-color: #000;
        font-family: sans-serif;
      }
      #streetview-container {
        position: absolute;
        left: 0;
        top: 0;
        width: 50%;
        height: 100%;
      }
      #map-container {
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 100%;
        border-left: 3px solid #333;
      }
      #control-panel {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        background: rgba(0, 0, 0, 0.9);
        color: #fff;
        padding: 12px 20px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        font-size: 13px;
        display: flex;
        gap: 15px;
      }
      .coordinate-box {
        font-family: monospace;
        color: #00ffcc;
      }
      #instructions {
        position: absolute;
        bottom: 20px;
        left: 20px;
        z-index: 999;
        background: rgba(0,0,0,0.8);
        color: #fff;
        padding: 10px;
        border-radius: 5px;
        font-size: 11px;
      }
    </style>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  </head>
  <body>

    <div id="control-panel">
      <div><b>Civil 3D Origo:</b> <span id="txt-lat" class="coordinate-box">58.997800</span>, <span id="txt-lng" class="coordinate-box">5.657300</span></div>
      <div>|</div>
      <div><b>Forskyvning Høyde:</b> <span id="txt-høyde" class="coordinate-box">-4.2m</span></div>
    </div>

    <div id="instructions">
      <b>Finjustering:</b><br>
      Bruk <b>Piltastene</b> for å flytte bygget horisontalt.<br>
      Bruk <b>PageUp / PageDown</b> for å heve eller senke koteplanet live!
    </div>

    <div id="streetview-container"></div>
    <div id="map-container"></div>

    <script>
      // ==========================================================
      // INPUT DATA FRA CIVIL 3D & REVIT
      // ==========================================================
      // De eksakte koordinatene fra den geografiske markøren din
      let origoGPS = { lat: 58.997800, lng: 5.657300 }; 
      
      // Siden markøren har kote 0.00 (havnivå), justerer vi for veien og kameraets øyehøyde
      let globalHøyde = -4.2; 
      
      // Sann Nord-rotasjon fra prosjektet
      const BYGG_ROTASJON_NORD = 31.75; 

      // De eksakte meter-offsettene til Aksekryss A / S1 fra nullpunktet
      const REVIT_OFFSET_X = 251.092; 
      const REVIT_OFFSET_Y = 100.559; 

      // Startposisjon for Street View ute i gata der du vil se modellen fra
      const kameraStartGPS = { lat: 59.000383, lng: 5.659569 }; 

      let panorama, map, origoMarkør, bygg2DOmriss, scene, camera, renderer, bygningsGruppe;

      function initPlatform() {
        // STREET VIEW (Venstre side) - Starter i veien og ser mot tomta (heading: 240)
        panorama = new google.maps.StreetViewPanorama(
          document.getElementById("streetview-container"), {
            position: kameraStartGPS,
            pov: { heading: 240, pitch: 0 }, 
            zoom: 1,
            visible: true
          }
        );

        // SATELLITTKART (Høyre side) - Sentrert over kaikanten
        map = new google.maps.Map(document.getElementById("map-container"), {
          center: { lat: 59.000200, lng: 5.659400 },
          zoom: 18,
          mapTypeId: 'satellite'
        });

        // Plasserer markøren nøyaktig der det blå/røde krysset i Civil 3D ligger
        origoMarkør = new google.maps.Marker({
          position: origoGPS,
          map: map,
          draggable: true,
          title: "Civil 3D Geographic Marker"
        });

        // Blått 2D-omriss for å visualisere bygget på satellittkartet
        bygg2DOmriss = new google.maps.Polygon({
          strokeColor: "#00aaff",
          strokeOpacity: 0.8,
          strokeWeight: 3,
          fillColor: "#00aaff",
          fillOpacity: 0.25,
          map: map
        });

        setupThreeJS();

        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        
        loader.load('25012 Tangen 7 - Nybygg.glb', function (gltf) {
          const modell = gltf.scene;
          modell.scale.set(1, 1, 1);
          
          bygningsGruppe = new THREE.Group();
          
          // 1. NESTING: Vi flytter modellen i forhold til det ekte markør-origoet
          modell.position.set(-REVIT_OFFSET_X, 0, -REVIT_OFFSET_Y);
          bygningsGruppe.add(modell);
          
          // 2. ABSOLUTT FLATING: Låser rotasjonen helt vannrett langs bakken
          bygningsGruppe.rotation.set(0, 0, 0);
          bygningsGruppe.rotation.y = THREE.MathUtils.degToRad(BYGG_ROTASJON_NORD);
          
          scene.add(bygningsGruppe);
          console.log("Modellen er kalibrert med Civil 3D-input!");
          
          oppdaterGeometriPosisjon();
          setupKeyboardControls();
          animate();
        });

        // Tillater flytting av ankeret hvis Civil 3D-verdien må mikro-justeres
        origoMarkør.addListener('drag', function(event) {
          origoGPS.lat = event.latLng.lat();
          origoGPS.lng = event.latLng.lng();
          oppdaterGeometriPosisjon();
        });

        panorama.addListener('pov_changed', () => updateCameraOrientation());
        panorama.addListener('zoom_changed', () => updateCameraOrientation());
      }

      function oppdaterGeometriPosisjon() {
        document.getElementById("txt-lat").innerText = origoGPS.lat.toFixed(6);
        document.getElementById("txt-lng").innerText = origoGPS.lng.toFixed(6);
        document.getElementById("txt-høyde").innerText = globalHøyde.toFixed(1) + "m";

        // 1. Regn ut 3D-posisjon i forhold til Street View-kameraets gjeldende posisjon
        if (panorama && bygningsGruppe) {
          const kamPos = panorama.getPosition();
          const R = 6378137; 
          const dLat = THREE.MathUtils.degToRad(origoGPS.lat - kamPos.lat());
          const dLng = THREE.MathUtils.degToRad(origoGPS.lng - kamPos.lng());
          const meterNord = dLat * R;
          const meterØst = dLng * R * Math.cos(THREE.MathUtils.degToRad(kamPos.lat()));
          
          bygningsGruppe.position.set(meterØst, globalHøyde, -meterNord);
        }

        // 2. Tegner 2D-polygonen på satellittkartet (ca. 155m lang kaikloss)
        const vinkelRad = THREE.MathUtils.degToRad(BYGG_ROTASJON_NORD);
        const latMeter = 111132; 
        const lngMeter = 40075000 * Math.cos(THREE.MathUtils.degToRad(origoGPS.lat)) / 360;

        // Vi forskyver senteret av 2D-polygonen med Revit-offsettene slik at den 
        // tegnes oppe på kaiområdet, akkurat der bygget ditt faktisk befinner seg!
        const senter2D = {
          lat: origoGPS.lat + ((REVIT_OFFSET_Y * Math.cos(vinkelRad) + REVIT_OFFSET_X * Math.sin(vinkelRad)) / latMeter),
          lng: origoGPS.lng + ((-REVIT_OFFSET_Y * Math.sin(vinkelRad) + REVIT_OFFSET_X * Math.cos(vinkelRad)) / lngMeter)
        };

        const l = 155; 
        const b = 58; 

        const hjørner = [
          { dx: -b/2, dy: -l/2 },
          { dx: b/2, dy: -l/2 },
          { dx: b/2, dy: l/2 },
          { dx: -b/2, dy: l/2 }
        ];

        const polygonStier = hjørner.map(h => {
          const rx = h.dx * Math.cos(vinkelRad) - h.dy * Math.sin(vinkelRad);
          const ry = h.dx * Math.sin(vinkelRad) + h.dy * Math.cos(vinkelRad);
          return {
            lat: senter2D.lat + (ry / latMeter),
            lng: senter2D.lng + (rx / lngMeter)
          };
        });

        bygg2DOmriss.setPaths(polygonStier);
        origoMarkør.setPosition(origoGPS);
      }

      function setupKeyboardControls() {
        window.addEventListener('keydown', function(e) {
          const stegGPS = 0.000002; 
          
          if (e.key === 'ArrowUp') { origoGPS.lat += stegGPS; e.preventDefault(); }
          if (e.key === 'ArrowDown') { origoGPS.lat -= stegGPS; e.preventDefault(); }
          if (e.key === 'ArrowLeft') { origoGPS.lng -= stegGPS; e.preventDefault(); }
          if (e.key === 'ArrowRight') { origoGPS.lng += stegGPS; e.preventDefault(); }
          
          if (e.key === 'PageUp') { globalHøyde += 0.1; e.preventDefault(); }
          if (e.key === 'PageDown') { globalHøyde -= 0.1; e.preventDefault(); }

          oppdaterGeometriPosisjon();
        });
      }

      function setupThreeJS() {
        const container = document.getElementById("streetview-container");
        scene = new THREE.Scene();
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(30, 60, 30);
        scene.add(directionalLight);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / 2 / window.innerHeight, 0.1, 5000);
        
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0); 
        renderer.setSize(window.innerWidth / 2, window.innerHeight);
        
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '10';
        renderer.domElement.style.pointerEvents = 'none'; 
        
        container.appendChild(renderer.domElement);
        window.addEventListener('resize', onWindowResize);
      }

      function updateCameraOrientation() {
        if (!panorama || !camera) return;
        const pov = panorama.getPov();
        camera.rotation.set(THREE.MathUtils.degToRad(pov.pitch || 0), -THREE.MathUtils.degToRad(pov.heading || 0), 0, 'YXZ');
        camera.fov = 180 / Math.pow(2, panorama.getZoom() || 1);
        camera.updateProjectionMatrix();
      }

      function onWindowResize() {
        camera.aspect = (window.innerWidth / 2) / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth / 2, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAKCY3L1KdO4oqxu_JVlCBkMCVHAcQOWNw&callback=initPlatform" async defer></script>
  </body>
</html>
