<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tangen 7 - Georeferert Street View</title>
    <style>
      html, body, #streetview-container { 
        height: 100%; 
        margin: 0; 
        padding: 0; 
        background-color: #000;
        overflow: hidden;
      }
    </style>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/loaders/DRACOLoader.js"></script>
  </head>
  <body>
    <div id="streetview-container"></div>

    <script>
      // ==========================================================
      // GEOGRAFISKE DATA FRA REVIT (TANGEN 7)
      // ==========================================================
      // GPS-koordinat for Aksekryss A / S1 (Hjørnet av bygget ditt) midt på tomta
      const BYGG_GPS = { lat: 59.000300, lng: 5.659350 }; 
      
      // Siden veien ligger på +2.3m over havet, og kameraet er i øyehøyde (ca 1.6m over veien),
      // setter vi denne til -3.9m for å plante underbygningen perfekt på asfalten.
      const BYGG_HØYDE = -3.9; 
      
      // Sann Nord-rotasjon fra Revit-kompasset ditt (31.75 grader)
      const BYGG_ROTASJON_NORD = 31.75; 

      // Eksakte forskyvninger fra Revit-tegningen din konvertert fra millimeter til meter
      const REVIT_OFFSET_X = 251.092; 
      const REVIT_OFFSET_Y = 100.559; // Dette tilsvarer Z-aksen i Three.js flateplan

      // Startposisjon for Street View-kameraet ute i gata
      const kameraStartGPS = { lat: 59.000383, lng: 5.659569 }; 

      let panorama, scene, camera, renderer, modell, bygningsGruppe;

      function initPlatform() {
        // Start Street View rettet direkte mot plenen (heading: 240)
        panorama = new google.maps.StreetViewPanorama(
          document.getElementById("streetview-container"), {
            position: kameraStartGPS,
            pov: { heading: 240, pitch: 0 }, 
            zoom: 1,
            visible: true
          }
        );

        setupThreeJS();

        // Konfigurer GLTF/DRACO-loader
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        loader.setDRACOLoader(dracoLoader);
        
        loader.load('25012 Tangen 7 - Nybygg.glb', function (gltf) {
          modell = gltf.scene;
          
          // MÅLESTOKK (1:1 meter fra Leia-eksporten)
          modell.scale.set(1, 1, 1);
          
          // ==========================================================
          // MATEMATISK PLASSERING AV REELLE AVSTANDER FRA TEGNINGEN DIN
          // ==========================================================
          // Vi oppretter en ren 3D-gruppe som skal fungere som aksekrysset (A / S1)
          bygningsGruppe = new THREE.Group();
          
          // Vi forskyver modellen med de nøyaktige meterne slik at hjørnet havner i gruppens (0,0,0)
          modell.position.x = -REVIT_OFFSET_X;
          modell.position.y = 0; 
          modell.position.z = -REVIT_OFFSET_Y; 
          
          // Vi legger modellen inn i gruppen vår
          bygningsGruppe.add(modell);
          
          // Nå roterer vi hele bygget nøyaktig rundt aksekrysset basert på Sann Nord
          bygningsGruppe.rotation.y = THREE.MathUtils.degToRad(BYGG_ROTASJON_NORD);
          
          scene.add(bygningsGruppe);
          console.log("Bygget er koordinert nøyaktig i forhold til aksekryss A / S1!");
          
          // Setter opp en rød pinne nøyaktig der aksekrysset (hjørnet) skal lande på plenen
          opprettHjelpelinje();
          
          // Kjør første geografiske plassering
          oppdaterByggPlassering();
          
          animate();
        }, undefined, function (error) {
          console.error("Feil under lasting av GLB-fil:", error);
        });
      }

      function opprettHjelpelinje() {
        const materiale = new THREE.LineBasicMaterial({ color: 0xff0000 });
        const punkter = [];
        punkter.push(new THREE.Vector3(0, -2, 0));
        punkter.push(new THREE.Vector3(0, 20, 0)); // Rød siktepinne på aksekrysset
        const geometri = new THREE.BufferGeometry().setFromPoints(punkter);
        const linje = new THREE.Line(geometri, materiale);
        scene.add(linje);
      }

      // GEODETISK SYNKRONISERING: Flytter 3D-verdenen stabilt i motsatt retning av der du går
      function oppdaterByggPlassering() {
        if (!panorama || !bygningsGruppe) return;

        const kamPos = panorama.getPosition();
        const kamLat = kamPos.lat();
        const kamLng = kamPos.lng();

        const R = 6378137; // Jordens radius i meter

        const dLat = THREE.MathUtils.degToRad(BYGG_GPS.lat - kamLat);
        const dLng = THREE.MathUtils.degToRad(BYGG_GPS.lng - kamLng);

        const meterNord = dLat * R;
        const meterØst = dLng * R * Math.cos(THREE.MathUtils.degToRad(kamLat));

        // Låser hele aksekrysset fast i nøyaktig meteravstand fra der du står i veien
        bygningsGruppe.position.set(meterØst, BYGG_HØYDE, -meterNord);
        
        updateCameraOrientation();
      }

      function setupThreeJS() {
        const container = document.getElementById("streetview-container");
        scene = new THREE.Scene();
        
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(30, 60, 30);
        scene.add(directionalLight);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setClearColor(0x000000, 0); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '10';
        renderer.domElement.style.pointerEvents = 'none'; 
        
        container.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
        
        if (panorama) {
          panorama.addListener('position_changed', () => oppdaterByggPlassering());
          panorama.addListener('pov_changed', () => updateCameraOrientation());
          panorama.addListener('zoom_changed', () => updateCameraOrientation());
        }
      }

      function updateCameraOrientation() {
        if (!panorama || !camera) return;
        const pov = panorama.getPov();
        if (!pov) return;

        const headingRad = THREE.MathUtils.degToRad(pov.heading || 0);
        const pitchRad = THREE.MathUtils.degToRad(pov.pitch || 0);

        camera.rotation.set(pitchRad, -headingRad, 0, 'YXZ');
        camera.fov = 180 / Math.pow(2, panorama.getZoom() || 1);
        camera.updateProjectionMatrix();
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
    </script>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAKCY3L1KdO4oqxu_JVlCBkMCVHAcQOWNw&callback=initPlatform" async defer></script>
  </body>
</html>
